  - name: RAL
    repo: dp2_prep
    rucio_rse: RAL_BUTLER_DISK
    scope: dp2_prep
    rse_root: /lsst:datadisk/butler/repos/dp2_prep/
    dtn_url: davs://webdav.echo.stfc.ac.uk:1094/lsst:datadisk/butler/repos/dp2_prep/
