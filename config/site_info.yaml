    repo: dp2_prep
    rucio_rse: SLAC_BUTLER_DISK
    scope: dp2_prep
    rse_root: /sdf/group/rubin/repo/dp2_prep/
    dtn_url: davs://usdf-xrootd.slac.stanford.edu:1094/lsst/butlerdisk/rucio/repo/dp2_prep/
    tagged_collection: LSSTCam/raw/20250604-20250921/SV_320_15/DM-57008/7277
    payload_name: multisite_test_7277/{lsstVersion}

  - name: IN2P3
    repo: dp2_prep
    rucio_rse: IN2P3_BUTLER_DISK
    scope: dp2_prep
    rse_root: /pnfs/in2p3.fr/lsst/butler/dp2_prep/
    dtn_url: davs://ccdavrubin.in2p3.fr:2880/pnfs/in2p3.fr/lsst/butler/dp2_prep/
    tagged_collection: LSSTCam/raw/20250604-20250921/SV_320_15/DM-57008/7276
